name: tweet

on:
  schedule:
    - cron: '20 * * * *'
  workflow_dispatch:

jobs:
  tweet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Auto Translate and Append to NG Words (if needed)
        run: |
          python - << 'EOF'
          import time
          import os
          from deep_translator import GoogleTranslator

          INPUT_FILE = "ng_words.txt⁠"

          if not os.path.exists(INPUT_FILE):
              print(f"Error: {INPUT_FILE} not found in {os.getcwd()}")
              exit(0)

          with open(INPUT_FILE, "r", encoding="utf-8") as f:
              content = f.read()

          # すでに翻訳済みのマークや多言語ワードが含まれていれば翻訳をスキップ
          if "# TRANSLATED" in content:
              print("すでに翻訳版が追加されているため、翻訳をスキップします。")
              exit(0)

          print("初回のため、多言語翻訳を実行してファイルに統合します...")
          lines = [line.strip() for line in content.splitlines() if line.strip()]

          LANGUAGES = [
              "en", "zh-CN", "zh-TW", "ko", "es", "fr", "de", "it", "pt", "ru", 
              "id", "th", "vi", "uk", "tr", "sv", "pl", "ro", "nl", "fi", 
              "el", "cs", "da", "hu", "km", "hi", "ne", "ca", "gl", "eu", 
              "ast", "ga", "an", "ia", "cy", "gd", "eo", "fy"
          ]

          translated_words = []
          for lang in LANGUAGES:
              print(f"[Translation] Translating for {lang}...")
              translator = GoogleTranslator(source='ja', target=lang)
              for line in lines:
                  if line.startswith("#") or line.isdigit() or len(line) <= 1:
                      continue
                  try:
                      translated_word = translator.translate(line)
                      if translated_word:
                          translated_words.append(translated_word.strip().lower())
                      time.sleep(0.02)
                  except Exception as e:
                      pass

          # 元のファイルに翻訳版を追記して上書き保存
          with open(INPUT_FILE, "a", encoding="utf-8") as f:
              f.write("\n# TRANSLATED\n")
              for w in sorted(list(set(translated_words))):
                  f.write(f"{w}\n")

          print("ng_words.txt⁠ への多言語の統合が完了しました！")
          EOF

      - name: Run bot
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_PASSWORD: ${{ secrets.BSKY_PASSWORD }}
        run: python bot.py
