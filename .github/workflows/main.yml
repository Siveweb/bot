name: tweet

on:
  schedule:
    - cron: '20 * * * *'
  workflow_dispatch:

jobs:
  tweet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Auto Translate NG Words (if needed)
        run: |
          python - << 'EOF'
          import time
          import os
          from deep_translator import GoogleTranslator

          INPUT_FILE = "ng_words.txt⁠⁠"
          
          # すでに英語の翻訳ファイルが存在していれば、毎回の翻訳をスキップする
          if os.path.exists("ng_words_en.txt"):
              print("多言語NGワードファイルは既に存在するため、翻訳をスキップします。")
              exit(0)

          if not os.path.exists(INPUT_FILE):
              print(f"Error: {INPUT_FILE} not found in {os.getcwd()}")
              exit(0)

          with open(INPUT_FILE, "r", encoding="utf-8") as f:
              lines = [line.strip() for line in f if line.strip()]

          LANGUAGES = [
              "en", "zh-CN", "zh-TW", "ko", "es", "fr", "de", "it", "pt", "ru", 
              "id", "th", "vi", "uk", "tr", "sv", "pl", "ro", "nl", "fi", 
              "el", "cs", "da", "hu", "km", "hi", "ne", "ca", "gl", "eu", 
              "ast", "ga", "an", "ia", "cy", "gd", "eo", "fy"
          ]

          for lang in LANGUAGES:
              file_lang = "zh" if lang == "zh-CN" else lang
              output_file = f"ng_words_{file_lang}.txt"
              
              print(f"[Translation] Generating translation file for {lang}...")
              translator = GoogleTranslator(source='ja', target=lang)
              
              with open(output_file, "w", encoding="utf-8") as outfile:
                  for line in lines:
                      if line.startswith("#") or line.isdigit() or len(line) <= 1:
                        outfile.write(f"{line.lower()}\n")
                        continue
                      try:
                        translated_word = translator.translate(line)
                        if translated_word:
                            outfile.write(f"{translated_word.strip().lower()}\n")
                        else:
                            outfile.write(f"{line.lower()}\n")
                        time.sleep(0.03)
                      except Exception as e:
                          outfile.write(f"{line.lower()}\n")
          print("All multilingual translation files generated successfully!")
          EOF

      - name: Run bot
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_PASSWORD: ${{ secrets.BSKY_PASSWORD }}
        run: python bot.py
